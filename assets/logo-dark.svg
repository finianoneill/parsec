<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" role="img" aria-label="parsec — no claim without a path">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- starfield -->
  <g fill="#e2e8f0">
    <circle cx="34" cy="28" r="1.1" opacity="0.55"/>
    <circle cx="205" cy="22" r="1.4" opacity="0.7"/>
    <circle cx="238" cy="64" r="1.0" opacity="0.4"/>
    <circle cx="30" cy="96" r="1.3" opacity="0.6"/>
    <circle cx="222" cy="118" r="1.1" opacity="0.5"/>
    <circle cx="52" cy="52" r="0.9" opacity="0.4"/>
    <circle cx="186" cy="86" r="0.9" opacity="0.45"/>
    <circle cx="66" cy="132" r="1.2" opacity="0.55"/>
    <circle cx="150" cy="20" r="1.0" opacity="0.5"/>
    <circle cx="108" cy="64" r="0.8" opacity="0.35"/>
    <circle cx="244" cy="156" r="1.2" opacity="0.5"/>
    <circle cx="18" cy="160" r="1.0" opacity="0.45"/>
  </g>

  <!-- apparent positions against the background, half a year apart -->
  <g fill="#94a3b8">
    <circle cx="88" cy="40" r="3" opacity="0.5"/>
    <circle cx="168" cy="40" r="3" opacity="0.5"/>
  </g>
  <path d="M 88 40 Q 128 22 168 40" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="2.5 4.5" opacity="0.55" stroke-linecap="round"/>

  <!-- sight lines crossing at the near star -->
  <g stroke="#818cf8" stroke-width="1.6" opacity="0.75" stroke-linecap="round">
    <line x1="76" y1="168" x2="168" y2="40"/>
    <line x1="180" y1="168" x2="88" y2="40"/>
  </g>

  <!-- Earth's orbit: two vantage points around the sun -->
  <path d="M 52 158 Q 128 192 204 158" fill="none" stroke="#64748b" stroke-width="1.6" opacity="0.8" stroke-linecap="round"/>
  <circle cx="128" cy="172" r="3.5" fill="#fbbf24" opacity="0.95"/>
  <g fill="#c7d2fe">
    <circle cx="76" cy="168" r="4.2"/>
    <circle cx="180" cy="168" r="4.2"/>
  </g>

  <!-- the near star, resolved by parallax -->
  <circle cx="128" cy="96" r="16" fill="#22d3ee" opacity="0.12"/>
  <circle cx="128" cy="96" r="9" fill="#22d3ee" opacity="0.28"/>
  <path d="M 128 80 L 132.5 91.5 L 144 96 L 132.5 100.5 L 128 112 L 123.5 100.5 L 112 96 L 123.5 91.5 Z" fill="#a5f3fc"/>
  <circle cx="128" cy="96" r="2.6" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="262" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="1.5" fill="url(#wordmark)">parsec</text>
  <text x="266" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5.2" fill="#94a3b8">NO CLAIM WITHOUT A PATH</text>
</svg>
