[project]
name = "parsec"
version = "0.2.1.dev0"
description = "Local-first research-agent harness: typed evidence DAG, replayable runs, budgeted context."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "httpx>=0.27",
    "rich>=13.7",
    "trafilatura>=2.2.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# Grounded-NLI escalation tier (M9): HHEM-2.1-Open via transformers.
# The default lexical tier needs none of this.
nli = [
    "transformers>=4.44",
    "torch>=2.3",
]
# Claude via Amazon Bedrock (SigV4 signing for the Mantle client).
bedrock = [
    "anthropic[bedrock]>=0.40",
]

[project.scripts]
parsec = "parsec.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy==2.4.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-randomly>=5.1.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsec"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit real network/API keys (deselected by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # No formatter is adopted yet and prompt text lives in long literals whose
    # bytes feed replay hashes; line length is not enforced until one is.
    "E501",
    # En dashes, multiplication signs and box-drawing characters are deliberate.
    "RUF001", "RUF002", "RUF003",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional `nli` extra: not installed in the default environment.
module = ["transformers", "transformers.*", "torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["parsec.verify.*", "parsec.store.*", "parsec.gateway.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
# Next ratchet: disallow_any_generics (54 bare dict/list annotations here).
