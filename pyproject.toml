[project]
name = "parsec"
version = "0.1.0"
description = "Local-first research-agent harness: typed evidence DAG, replayable runs, budgeted context."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "httpx>=0.27",
    "rich>=13.7",
    "trafilatura>=2.2.0",
]

[project.optional-dependencies]
# Grounded-NLI escalation tier (M9): HHEM-2.1-Open via transformers.
# The default lexical tier needs none of this.
nli = [
    "transformers>=4.44",
    "torch>=2.3",
]

[project.scripts]
parsec = "parsec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsec"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit real network/API keys (deselected by default)",
]
addopts = "-m 'not live'"
